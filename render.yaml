services:
  - type: web
    name: client-bunny
    runtime: go
    plan: free
    buildCommand: go mod tidy && go build -o google-maps-scraper . && curl -sL -o obscura.tar.gz https://github.com/h4ckf0r0day/obscura/releases/latest/download/obscura-x86_64-linux.tar.gz && tar xzf obscura.tar.gz && chmod +x obscura start.sh
    startCommand: ./start.sh
    envVars:
      - key: OBSCURA_STEALTH
        value: "true"
